<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- Favicon package generated by Favicon.im Converter -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="../../assets/favicons/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../../assets/favicons/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../../assets/favicons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="../../assets/favicons/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="../../assets/favicons/android-chrome-512x512.png">
    <meta name="theme-color" content="#ffffff">
    <link rel="stylesheet" href="../../css/admin/rentals.css">
    <title>BibliotecaBooks</title>
</head>
<body>
    <div class="content" id="content-function">
        <header class="header">
            <div class="logotype-container">
                <img class="logo-icon" alt="icone de livro" src="../../assets/icons/OpenBook.svg">
                <h1 class="logo-text">BibliotecaBooks</h1>
            </div>
            <div class="user-container">
                <div class="user-organizer">
                    <p class="user-name">Administrador</p>
                    <a class="configurations">configurações</a>
                </div>
                <img alt="icone de perfil" src="../../assets/icons/Profile.svg">
            </div>
        </header>
        <aside class="menu" id="menu-function">
            <span class="menu-button">
                <img class="back-icon" src="../../assets/icons/Back.svg"/>
            </span>
            <a href="dashboard.html" class="dashboard">
                <p>DASHBOARD</p>
            </a>
            <a href="rentals.html" class="rentals">
                <p>EMPRÉSTIMOS</p>
            </a>
            <a href="users.html" class="users">
                <p>USUÁRIOS</p>
            </a>
            <a href="publishers.html" class="publishers">
                <p>EDITORAS</p>
            </a>
            <a href="books.html" class="books">
                <p>LIVROS</p>
            </a>
        </aside>
        <main class="main">
            <span class="main-title">
                <p>EMPRÉSTIMOS</p>
                <img class="return-icon" id="return-icon-function" alt="voltar" src="../../assets/icons/Return.svg">
            </span>
            <div class="main-content">
                <div class="main-header">
                    <div class="search-side">
                        <input class="search-input" id="search-input-function" type="search" placeholder="Buscar empréstimos...">
                    </div>
                    <div class="filter-side">
                        <div class="filter">
                            <button class="filter-button" id="filter-button-function">Filtrar</button>
                        </div>
                        <div class="add">
                            <button class="add-button" id="add-button-function">Novo Aluguel</button>
                        </div>
                    </div>
                </div> 
                <div class="rentals-table-container">
                    <table class="rentals-table" id="rentals-table-function">
                        <thead>
                            <tr>
                                <th>Locátario</th>
                                <th>Livro</th>
                                <th>Data Aluguel</th>
                                <th>Prazo</th>
                                <th>Entrega</th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="rentals-table"></tbody>
                    </table>
                    <div class="pagination">
                        <p id="pagination-info"></p>
                        <div class="pagination-buttons-container">
                            <button class="pagination-button" id="back-pagination"></button>
                            <button class="pagination-button" id="front-pagination"></button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <div class="menu-modal" id="menu-modal-function">
        <div class="preferences">
            <span>Preferências</span>
        </div>
        <div class="logout">
            <span class="btn-logout">Sair</span>
        </div>
    </div>
    <div class="filter-menu" id="filter-menu-function">
        <button class="filter-option" data-filter="az">A - Z</button>
        <hr class="separete-line">
        <button class="filter-option" data-filter="za">Z - A</button>
    </div>
    <div class="rental-modal" id="rental-modal-function">

    <section class="rental-register">
        <div class="rental-modal-header">
            <h1>Novo Empréstimo</h1>

            <button
                class="close-rental-modal"
                id="close-rental-modal"
                type="button">
            </button>
        </div>
        <form class="rental-form" id="rental-form">
            <div class="inputs">
                <label class="text-inputs" for="rental-renter">
                    Locatário
                </label>

                <select
                    class="entry-input"
                    id="rental-renter"
                    required>

                    <option value="" selected disabled>
                        Selecione um usuário
                    </option>

                </select>
            </div>
            <div class="inputs">
                <label class="text-inputs" for="rental-book">
                    Livro
                </label>

                <select class="entry-input" id="rental-book" required>
                    <option value="" selected disabled>
                        Selecione um livro
                    </option>
                </select>
            </div>
            <div class="inputs">
                <label class="text-inputs" for="rental-date">
                    Data do aluguel
                </label>
                <input
                    class="entry-input"
                    id="rental-date"
                    type="date"
                    required>
            </div>
            <div class="inputs">
                <label class="text-inputs" for="rental-due-date">
                    Prazo de devolução
                </label>
                <input
                    class="entry-input"
                    id="rental-due-date"
                    type="date"
                    required>
            </div>
            <div class="rental-btns">
                <button
                    class="btn-cancel-rental"
                    id="cancel-rental"
                    type="button">
                    Cancelar
                </button>
                <button
                    class="btn-register-rental"
                    type="submit">
                    Salvar
                </button>
            </div>
        </form>
    </section>
</div>
    <script src="../../js/admin/rentals.js"></script>
</body>
</html>

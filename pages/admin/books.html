<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- Favicon package generated by Favicon.im Converter -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="../../assets/favicons/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../../assets/favicons/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../../assets/favicons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="../../assets/favicons/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="../../assets/favicons/android-chrome-512x512.png">
    <meta name="theme-color" content="#ffffff">
    <link rel="stylesheet" href="../../css/admin/books.css">
    <title>BibliotecaBooks</title>
</head>
<body>
    <div class="content" id="content-function">
        <header class="header">
            <div class="logotype-container">
                <img class="logo-icon" alt="icone de livro" src="../../assets/icons/OpenBook.svg">
                <h1 class="logo-text">BibliotecaBooks</h1>
            </div>
            <div class="user-container">
                <div class="user-organizer">
                    <p class="user-name">Administrador</p>
                    <a class="configurations">configurações</a>
                </div>
                <img alt="icone de perfil" src="../../assets/icons/Profile.svg">
            </div>
        </header>
        <aside class="menu" id="menu-function">
            <span class="menu-button">
                <img class="back-icon" src="../../assets/icons/Back.svg"/>
            </span>
            <a href="dashboard.html" class="dashboard">
                <p>DASHBOARD</p>
            </a>
            <a href="rentals.html" class="rentals">
                <p>EMPRÉSTIMOS</p>
            </a>
            <a href="users.html" class="users">
                <p>USUÁRIOS</p>
            </a>
            <a href="publishers.html" class="publishers">
                <p>EDITORAS</p>
            </a>
            <a href="books.html" class="books">
                <p>LIVROS</p>
            </a>
        </aside>
        <main class="main">
            <span class="main-title">
                <p>LIVROS</p>
                <img class="return-icon" id="return-icon-function" alt="voltar" src="../../assets/icons/Return.svg">
            </span>
            <div class="main-content">
                <div class="main-header">
                    <div class="search-side">
                        <input class="search-input" id="search-input-function" type="search" placeholder="Buscar livros...">
                    </div>
                    <div class="filter-side">
                        <div class="filter">
                            <button class="filter-button" id="filter-button-function">Filtrar</button>
                        </div>
                        <div class="add">
                            <button class="add-button" id="add-button-function">Novo Livro</button>
                        </div>
                    </div>
                </div> 
                <div class="books-table-container">
                    <table class="books-table" id="books-table-function">
                        <thead>
                            <tr>
                                <th>Título</th>
                                <th>Autor</th>
                                <th>Lançamento</th>
                                <th>Estoque Total</th>
                                <th>Em Uso</th>
                                <th>Editoras</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="books-table"></tbody>
                    </table>
                    <div class="pagination">
                        <p id="pagination-info"></p>
                        <div class="pagination-buttons-container">
                            <button class="pagination-button" id="back-pagination"></button>
                            <button class="pagination-button" id="front-pagination"></button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <div class="menu-modal" id="menu-modal-function">
        <div class="preferences">
            <span>Preferências</span>
        </div>
        <div class="logout">
            <span class="btn-logout">Sair</span>
        </div>
    </div>
    <div class="filter-menu" id="filter-menu-function">
        <button class="filter-option" data-filter="az">A - Z</button>
        <hr class="separete-line">
        <button class="filter-option" data-filter="za">Z - A</button>
    </div>
    <div class="modal-overlay" id="book-modal-function">
        <div class="book-modal">
            <div class="modal-header">
                <h2>Novo Livro</h2>
            </div>
            <form id="book-form">
                <div class="modal-inputs">
                    <label for="book-title">Título</label>
                    <input type="text" id="book-title" required placeholder="Digite o título do livro">
                </div>
                <div class="modal-inputs">
                    <label for="book-author">Autor</label>
                    <input type="text" id="book-author" required placeholder="Digite o nome do autor">
                </div>
                <div class="modal-inputs">
                    <label for="book-release-date">
                        Data de lançamento
                    </label>
                    <input type="date" id="book-release-date" required>
                </div>
                <div class="modal-inputs">
                    <label for="book-stock">
                        Quantidade em estoque
                    </label>
                    <input type="number" id="book-stock" min="1" required placeholder="Ex: 5">
                </div>
                <div class="modal-inputs">
                    <label for="book-publisher">
                        Editora
                    </label>
                    <select id="book-publisher" required>
                        <option value="" selected disabled>
                            Selecione uma editora
                        </option>
                    </select>
                </div>
                <div class="modal-buttons">
                    <button class="cancel-button" id="cancel-book" type="button">
                        Cancelar
                    </button>
                    <button class="save-button" type="submit">
                        Salvar
                    </button>
                </div>
            </form>
        </div>
    </div>
    <script src="../../js/admin/books.js"></script>
</body>
</html>

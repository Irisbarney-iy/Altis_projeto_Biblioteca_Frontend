<!DOCTYPE html>
<html lang="pt-br">
<head>

    <link rel="icon" type="image/png" sizes="32x32" href="../../assets/favicons/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../../assets/favicons/apple-touch-icon.png">

    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">

    <link rel="stylesheet" href="../../css/auth/forgot-password.css">
    <title>BibliotecaBooks</title>
</head>
<body>
    <main class="content">
        <section class="banner">
            <div class="banner-content">
                <img src="../../assets/icons/book-hardcover-open-svgrepo-com2-nobg.svg" alt="Banner da BibliotecaBooks">
                <h1 class="logo-text">BibliotecaBooks</h1>
            </div>
        </section>
        <section class="login">
            <h1>Recuperar senha</h1>
            <form class="inputs-form">
                <div class="inputs">
                    <label class="texto-inputs" for="email">Email</label>
                    <input class="input-entrada" id="email" type="email" name="email" placeholder="Insira seu email" required>
                </div>
                <div class="inputs">
                    <label class="texto-inputs" for="cpf">CPF</label>
                    <input class="input-entrada" id="cpf" type="text" name="cpf" placeholder="___.___.___-__" required>
                </div>
                <div class="btns">
                    <button class="btn-cancelar" type="button">Cancelar</button>
                    <button class="btn-validar" type="submit">Validar dados</button>
                </div>
            </form>
        </section>
    </main>
</body>

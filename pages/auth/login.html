<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../css/auth/login.css">
    <title>BibliotecaBooks</title>
</head>
<body>
    <main class="content">
        <section class="banner">
            <img src="../../assets/icons/book-hardcover-open-svgrepo-com.svg" alt="Banner da BibliotecaBooks">
            <h1 class="logo-text">BibliotecaBooks</h1>
        </section>
        <section class="login">
            <h1>Bem vindo de volta!</h1>
            <form>
                <p class="texto-inputs">Email</p>
                <input class="input-email" type="email" name="email" placeholder="Ex: exemplo@gmail.com" required>
                <p class="texto-inputs">Senha</p>
                <input class="input-senha" type="password" name="senha" placeholder="Insira sua senha" required>
                <h5 class="esqueceu-senha">Esqueceu a senha?</h5>
                <input class="input-lembrar" type="checkbox" name="Lembrar-me" id="Lembrar-me">
                <label class="texto-lembrar" for="Lembrar-me">Lembrar-me</label>
                <div class="btns">
                    <button class="btn-limpar" type="reset">Limpar</button>
                    <button class="btn-fazer-login" type="submit">Fazer login</button>
                </div>
            </form>
            <p class="cadastrar">Não tem uma conta? <a href="../../pages/auth/register.html">Cadastre-se</a></p>
        </section>
    </main>
</body>
</html>

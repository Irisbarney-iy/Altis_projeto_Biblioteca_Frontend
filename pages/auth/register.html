<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- Favicon package generated by Favicon.im Converter -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="../../assets/favicons/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../../assets/favicons/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../../assets/favicons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="../../assets/favicons/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="../../assets/favicons/android-chrome-512x512.png">
    <meta name="theme-color" content="#ffffff">
    <link rel="stylesheet" href="../../css/auth/register.css">
    <title>BibliotecaBooks</title>
</head>
<body>
    <main class="content">
        <section class="register">
            <h1>Seja bem vindo!</h1>
            <form class="inputs-form">
                <div class="inputs">
                    <label class="text-inputs" for="name">Nome completo</label>
                    <input class="entry-input" id="name" type="text" name="name" minlength="3" maxlength="100" placeholder="Insira seu nome" required>
                </div>
                <div class="inputs">
                    <label class="text-inputs" for="email">Email</label>
                    <input class="entry-input" id="email" type="email" pattern="^[a-zA-Z0-9]+@gmail\.com$" name="email" minlength="6" maxlength="255" placeholder="Insira seu email (@gmail.com)" required>
                </div>
                <div class="inputs">
                    <label class="text-inputs" for="cpf">CPF</label>
                    <input class="entry-input" id="cpf" type="text" name="cpf" maxlength="14" autocomplete="off" placeholder="___.___.___-__" required>
                </div>
                <div class="inputs">
                    <label class="text-inputs" for="date-birth">Data de Nascimento</label>
                    <input class="entry-input" id="date-birth" type="date" name="date-birth" placeholder="__/__/____" required>
                </div>
                <div class="inputs">
                    <label class="text-inputs" for="address">Endereço</label>
                    <input class="entry-input" id="address" type="text" name="address" placeholder="Rua, Nº - Cidade, Estado" required>
                </div>
                <div class="inputs">
                    <label class="text-inputs" for="password">Senha</label>
                    <div class="input-container">
                        <input class="entry-input" id="password" type="password" name="password" minlength="8" maxlength="15" placeholder="Insira sua senha" required>
                        <button class="ocult-button" id="ocult-button-functional" type="button"><img class="ocult-icon" id="ocult-icon-image" src="../../assets/icons/Invisible.svg"></button>
                    </div>
                </div>
                <div class="inputs">
                    <label class="text-inputs" for="confirm-password">Confirme sua senha</label>
                    <div class="input-container">
                        <input class="entry-input" id="confirm-password" type="password" name="confirm-password" placeholder="Confirme sua senha" required>
                        <button class="ocult-button" id="ocult-button-functional-confirm" type="button"><img class="ocult-icon-confirm" id="ocult-icon-image-confirm" src="../../assets/icons/Invisible.svg"></button>
                    </div>
                </div>
                <div class="btns">
                    <button class="btn-clear" type="reset">Limpar</button>
                    <button class="btn-register" type="submit">Cadastrar-se</button>
                </div>
            </form>
            <p class="login-link">Já tem uma conta? <a href="../../index.html">Faça login</a></p>
        </section>
        <section class="banner">
            <div class="banner-content">
                <img src="../../assets/icons/book.svg" alt="Banner da BibliotecaBooks">
                <h1 class="logotype-text">BibliotecaBooks</h1>
            </div>
        </section>
    </main>
    <script src="../../js/auth/register.js"></script>
</body>
</html>

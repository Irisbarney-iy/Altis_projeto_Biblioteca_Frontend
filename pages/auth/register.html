<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- Favicon package generated by Favicon.im Converter -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="../../assets/favicons/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../../assets/favicons/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../../assets/favicons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="../../assets/favicons/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="../../assets/favicons/android-chrome-512x512.png">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <meta name="theme-color" content="#ffffff">
    <link rel="stylesheet" href="../../css/auth/register.css">
    <title>BibliotecaBooks</title>
</head>
<body>
    <main class="content">
        <section class="register">
            <h1>Seja bem vindo!</h1>
            <form class="inputs-form">
                <div class="inputs">
                    <label class="texto-inputs" for="nome">Nome completo</label>
                    <input class="input-entrada" id="nome" type="text" name="nome" placeholder="Insira seu nome" required>
                </div>
                <div class="inputs">
                    <label class="texto-inputs" for="email">Email</label>
                    <input class="input-entrada" id="email" type="email" name="email" placeholder="Insira seu email" required>
                </div>
                <div class="inputs">
                    <label class="texto-inputs" for="cpf">CPF</label>
                    <input class="input-entrada" id="cpf" type="text" name="cpf" placeholder="___.___.___-__" required>
                </div>
                <div class="inputs">
                    <label class="texto-inputs" for="data-nascimento">Data de Nascimento</label>
                    <input class="input-entrada" id="data-nascimento" type="text" name="data-nascimento" placeholder="__/__/____" required>
                </div>
                <div class="inputs">
                    <label class="texto-inputs" for="endereco">Endereço</label>
                    <input class="input-entrada" id="endereco" type="text" name="endereco" placeholder="Rua, Nº - Cidade, Estado" required>
                </div>
                <div class="inputs">
                    <label class="texto-inputs" for="senha">Senha</label>
                    <input class="input-entrada" id="senha" type="password" name="senha" placeholder="Insira sua senha" required>
                </div>
                <div class="inputs">
                    <label class="texto-inputs" for="confirmar-senha">Confirme sua senha</label>
                    <input class="input-entrada" id="confirmar-senha" type="password" name="confirmar-senha" placeholder="Confirme sua senha" required>
                </div>
                <div class="btns">
                    <button class="btn-limpar" type="reset">Limpar</button>
                    <button class="btn-cadastrar" type="submit">Cadastrar-se</button>
                </div>
            </form>
            <p class="login-link">Já tem uma conta? <a href="../../pages/auth/login.html">Faça login</a></p>
        </section>
        <section class="banner">
            <div class="banner-content">
                <img src="../../assets/icons/book-hardcover-open-svgrepo-com.svg" alt="Banner da BibliotecaBooks">
                <h1 class="logo-text">BibliotecaBooks</h1>
            </div>
        </section>
    </main>
    <script src="../../js/auth/register.js"></script>
</body>
</html>

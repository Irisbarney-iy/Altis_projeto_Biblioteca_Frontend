<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- Favicon package generated by Favicon.im Converter -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="../../assets/favicons/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../../assets/favicons/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../../assets/favicons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="../../assets/favicons/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="../../assets/favicons/android-chrome-512x512.png">
    <meta name="theme-color" content="#ffffff">
    <link rel="stylesheet" href="../../css/auth/change-password.css">
    <title>BibliotecaBooks</title>
</head>
<body>
    <main class="content">
        <section class="banner">
            <div class="banner-content">
                <img src="../../assets/icons/book.svg" alt="Banner da BibliotecaBooks">
                <h1 class="logotype-text">BibliotecaBooks</h1>
            </div>
        </section>
        <section class="change-password-form">
            <h1>Alterar senha</h1>
            <form class="inputs-form">
                <div class="inputs">
                    <label class="text-inputs" for="password">Nova senha</label>
                    <div class="input-container">
                        <input class="entry-input" id="password" type="password" name="password" minlength="8" maxlength="15" placeholder="Insira sua nova senha" required>
                        <button class="ocult-button" id="ocult-button-functional" type="button"><img class="ocult-icon" id="ocult-icon-image" src="../../assets/icons/visible.svg"></button>
                    </div>
                </div>
                <div class="inputs">
                    <label class="text-inputs" for="confirm-password">Confirmar nova senha</label>
                    <div class="input-container">
                        <input class="entry-input" id="confirm-password" type="password" name="confirm-password" placeholder="Confirme sua nova senha" required>
                        <button class="ocult-button" id="ocult-button-functional-confirm" type="button"><img class="ocult-icon-confirm" id="ocult-icon-image-confirm" src="../../assets/icons/visible.svg"></button>
                    </div>
                </div>
                <div class="btns">
                    <button class="btn-cancel" type="button">Cancelar</button>
                    <button class="btn-save" type="submit">Salvar Alterações</button>
                </div>
            </form>
        </section>
    </main>
    <script src="../../js/auth/change-password.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- Favicon package generated by Favicon.im Converter -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="../../assets/favicons/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../../assets/favicons/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../../assets/favicons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="../../assets/favicons/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="../../assets/favicons/android-chrome-512x512.png">
    <meta name="theme-color" content="#ffffff">
    <link rel="stylesheet" href="../../css/user/dashboard.css">
    <title>BibliotecaBooks</title>
</head>
<body>
    <div class="content">
        <header class="header">
            <div class="logotype-container">
                <img class="logo-icon" alt="icone de livro" src="../../assets/icons/OpenBook.svg">
                <h1 class="logo-text">BibliotecaBooks</h1>
            </div>
            <div class="user-container">
                <div class="user-organizer">
                    <p class="user-name" id="user-name">Usuário</p>
                    <a class="configurations">configurações</a>
                </div>
                <img alt="icone de perfil" src="../../assets/icons/Profile.svg">
            </div>
        </header>
        <main class="main">
            <span class="main-title">
                <p>DASHBOARD</p>
            </span>
            <div class="main-content">
                <div class="dashboard-cards">
                    <div class="dashboard-card">
                        <div class="card-info">
                            <p class="card-title">Empréstimos Ativos</p>
                            <h2 id="active-rentals">0</h2>
                        </div>
                        <img src="../../assets/icons/Page.svg" alt="Ícone de empréstimos">
                    </div>
                    <div class="dashboard-card late-card">
                        <div class="card-info">
                            <p class="card-title">Atrasos</p>
                            <h2 id="late-rentals">0</h2>
                        </div>
                        <img src="../../assets/icons/Error.svg" alt="Ícone de alerta">
                    </div>
                    <div class="dashboard-card">
                        <div class="card-info">
                            <p class="card-title">Retiradas</p>
                            <h2 id="total-rentals">0</h2>
                        </div>
                        <img src="../../assets/icons/PayDate.svg" alt="Ícone de retiradas">
                    </div>
                    <div class="dashboard-card">
                        <div class="card-info">
                            <p class="card-title">Meus Livros</p>
                            <h2 id="my-books">0</h2>
                        </div>
                        <img src="../../assets/icons/bookClosed.svg" alt="Ícone de livros">
                    </div>
                </div>
            </div>
        </main>
    </div>
    <div class="menu-modal" id="menu-modal-function">
        <div class="preferences">
            <span>Preferências</span>
        </div>
        <div class="logout">
            <span class="btn-logout">Sair</span>
        </div>
    </div>
    <script src="../../js/user/dashboard.js"></script>
</body>
</html>
